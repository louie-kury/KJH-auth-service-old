spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: louie-kury-auth-service
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      data-source-properties:
        connectionTimeZone: "+09:00"
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
      hibernate.type.java_time_use_direct_jdbc: true
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
  jackson:
    time-zone: Asia/Seoul
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

verification:
  email-hmac-key: ${VERIFICATION_EMAIL_HMAC_KEY:}
  code-hmac-key: ${VERIFICATION_CODE_HMAC_KEY:}
  brevo-api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:}
  ip-limit: ${VERIFICATION_IP_LIMIT:100}
  ip-window-seconds: ${VERIFICATION_IP_WINDOW_SECONDS:3600}

logging:
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
